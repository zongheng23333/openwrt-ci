name: Cache-Clean

on:
  schedule:
    - cron: 0 20 * * 0
  workflow_dispatch:

permissions:
  actions: write   # 只授予 actions 写权限

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all caches (except latest 5)
        run: |
          # 获取所有缓存的 key（按最近使用排序），跳过前 5 个，删除其余
          gh cache list --limit 100 --sort last_used --order desc --json key --jq '.[5:].[] | .key' | xargs -I {} gh cache delete {}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
